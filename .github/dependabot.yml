version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Python dependencies
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/util/ci"
      - "/util/nix"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "python"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Docs generator
  - package-ecosystem: "npm"
    directory: "/builddefs/docsgen"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Git submodules (lib/chibios, lib/pico-sdk, ...) are intentionally NOT
  # tracked: they must stay on the exact commits the QMK/Vial base expects.
  # Bumping one to its upstream HEAD breaks the firmware build (for example
  # ChibiOS HEAD dropped chlib.h, see closed PR #92). Move them together
  # with a vial-qmk merge instead.
